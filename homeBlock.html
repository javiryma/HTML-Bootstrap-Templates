<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Home Page</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            .homeContainer
            {
                display: block;
                height: 100%;                               
                padding: 20px;                
            }
            .homeContainer div
            {
                padding: 20px;
                text-align: center;
                margin: 2px;
            }
            .header {
                height: 100px;
                background-color: #f1f1f1;
            }
            .nav {
               height: 20px;;
               background-color: #f1f1f1;
            }
            .content {
                height: 100px;
                background-color: #2196F3;
            }
            
            .footer {
               height: 60px;
               background-color: #f1f1f1;
            }
        </style>
    </head>
    <body>
        <div class="homeContainer">
            <div class="header">Header</div>
            <div class="nav">Nav</div>
            <div class="content">content</div>
            <div class="footer">footer</div>
        </div>
    </body>
</html>
